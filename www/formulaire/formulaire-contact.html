<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulaire de Contact</title>

  <!-- Bootstrap CSS -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
    rel="stylesheet" 
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" 
    crossorigin="anonymous"
  >
  <link rel="stylesheet" href="style.css">
   <!-- Font Cal Sans Google  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cal+Sans&display=swap" rel="stylesheet">
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />

  <style>
      /* === Styles responsive ajoutés === */
    body {
      margin: 0;
      padding: 0;
      background-color: #fff;
    }

    /* ===== Header ===== */
    .header {
      flex-wrap: wrap;
      justify-content: center;
      text-align: center;
    }

    .header .logo {
      max-width: 150px;
      height: auto;
    }


    /* ===== Text section ===== */
    .text-section {
      text-align: center;
      padding: 1.5rem;
    }

    .text-section .text-1 {
      font-size: 1.8rem;
      font-weight: bold;
    }

    .text-section .text-2 {
      font-size: 1.1rem;
      color: #666;
    }

     /* ===== Responsive text scaling ===== */
    @media (max-width: 768px) {
      .blockcontainer {
      text-align: center;
      width: 100%;
      padding: 0px 20px;
      margin-top: 100px;
      } 
    }

    @media (max-width: 480px) {
      .blockcontainer {
      text-align: center;
      width: 100%;
      padding: 0px 20px;
      margin-top: 100px;
      } 
      .bg-img2 {
      height: 160vh;
      }
    }
  </style>
</head>

<body>
  <header class="header container my-4 d-flex align-items-center gap-3">
    <div class="logo-wrapper">
      <img src="logo_white-1.png" alt="Logo Nugery" class="logo" width="200" height="108">
    </div>
  </header>
  <main>
    <div class="blockcontainer">
    <div>
      <span class="welcome">Discutons de votre projet...</p>
    </div>

    <div class="contact-container">
      <h5 class="welcome-form">Laissez nous vos coordonnées</h5>

      <form action="https://formspree.io/f/manlrvzq" method="POST">
        <!-- Utiliser _next et une URL absolue -->
        <input type="hidden" name="_next" value="confirmation.html">

        <!-- Le _redirect n'est pas réalisée
        <input type="hidden" name="_redirect" value="confirmation.html">
        -->

        <div>
          <label for="telephone">Votre numéro de téléphone portable français (obligatoire)*</label>
          <input type="tel" id="telephone" name="telephone" inputmode="numeric" maxlength="10" placeholder="Ex : 0612345678" required>
        </div>
        <br/>
        <div>
          <label for="email">Votre adresse email *</label>
          <input type="email" id="email" name="email" placeholder="ex : nom@exemple.com" required>
        </div>
        <br/>
        <div>
          <label for="codepostal">Code postal de votre chantier *</label>
          <input type="text" id="codepostal" name="codepostal" inputmode="numeric" maxlength="5" placeholder="Ex : 75001" required>
        </div>
        <br/>
        <h5 class="welcome-form">On vous contacte bientôt</h5>

        <button type="submit" class="btn btn-light btn-lg custom-btn-2">
          Envoyer mes informations
        </button>
      </form>
    </div>
    <div class="back">
    <a href="index.html" class="custom-btn-4">Retourner à l'acceuil</a>
  </div>
  </div>
  </main>
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
<picture class="bg-img2">
	  <source media="(max-width: 100vh)" srcset="background.jpeg">
		<img class="skip-lazy" src="background.jpeg">
	</picture>
</html>
