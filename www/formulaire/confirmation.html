<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirmation</title>

  <!-- Bootstrap CSS -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
    rel="stylesheet" 
    crossorigin="anonymous"
  >

  <style>
    /* ----- En-tête (logo + boutons à droite) ----- */
    .header {
      position: absolute;
      top: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      z-index: 1000;
    }

    .logo-wrapper {
      display: inline-block;
      overflow: hidden;
      border-radius: 6px;
      position: relative;
    }

    .logo-wrapper img {
      display: block;
      width: 200px;
      height: auto;
      user-select: none;
      pointer-events: none;
    }

    /* Effet de brillance sur le logo */
    .logo-wrapper::after {
      content: "";
      position: absolute;
      top: -40%;
      left: -35%;
      width: 60%;
      height: 180%;
      background: linear-gradient(120deg, rgba(255,255,255,0) 0%,
                                 rgba(255,255,255,0.6) 40%,
                                 rgba(255,255,255,0.9) 50%,
                                 rgba(255,255,255,0.6) 60%,
                                 rgba(255,255,255,0) 100%);
      transform: rotate(-25deg);
      transition: transform 600ms cubic-bezier(.2,.9,.3,1), opacity 200ms;
      opacity: 0;
      pointer-events: none;
      mix-blend-mode: screen;
      filter: blur(4px);
    }

    .logo-wrapper:hover::after {
      transform: translateX(220%) rotate(-25deg);
      opacity: 1;
    }

    .header-buttons {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
    }

    .header-btn {
      width: 260px;
      border: 2px solid #000;
      background-color: #fff;
      color: #000;
      font-size: 18px;
      border-radius: 8px;
      padding: 10px 15px;
      transition: all 0.3s ease-in-out;
      text-align: center;
    }

    .header-btn:hover {
      background-color: #000;
      color: #fff;
      transform: scale(1.03);
    }

    /* ----- Styles généraux ----- */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #f7f7f7;
      font-family: 'Segoe UI', Arial, sans-serif;
      margin: 0;
      background-size: cover;
      background-position: center;
    }

    .contact-container {
      background: #fff;
      padding: 40px 30px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 400px;
      width: 90%;
      margin-top: 180px;
    }

    h4 {
      font-weight: 600;
      margin-bottom: 20px;
      color: #333;
      font-size: 1.1rem;
    }

    .style-title {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.6rem;
      font-weight: 300;
      color: #000;
      margin-bottom: 0.3rem;
    }

    /* ----- Effet fade-in ----- */
    .fadein-text, .fadein-1, .fadein-2, .fadein-3, .icon-fadein-1, .icon-fadein-2, .icon-fadein-3 {
      opacity: 0;
      animation: fadeIn 2s ease-in forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ----- Responsive Design ----- */
    @media (max-width: 768px) {
      .header {
        position: relative;
        flex-direction: column;
        align-items: center;
        gap: 15px;
        text-align: center;
      }

      .logo-wrapper img {
        width: 140px;
        height: auto;
      }

      .header-buttons {
        width: 100%;
        align-items: center;
      }

      .header-btn {
        width: 80%;
        font-size: 16px;
      }

      .contact-container {
        margin-top: 100px;
        padding: 25px 20px;
        width: 95%;
      }

      .style-title {
        font-size: 1.3rem;
      }

      h4 {
        font-size: 1rem;
      }
    }

    @media (max-width: 480px) {
      .header-btn {
        width: 100%;
        font-size: 15px;
      }
      .logo-wrapper img {
        width: 120px;
      }
      .contact-container {
        padding: 20px 15px;
      }
    }
  </style>
</head>

<body background="nugery-contact-form-bg-img-2.png">

  <div class="header">
    <div class="logo-wrapper">
      <a href="index.html">
        <img src="nugery-logo.jpg" alt="nugery-logo" class="logo">
      </a>
    </div>

    <div class="header-buttons">
      <a href="index.html" class="btn btn-light custom-btn header-btn">
        <i class="bi bi-house"></i> Revenir à la page d'accueil
      </a>
    </div>
  </div>

  <div class="contact-container">
    <div class="text-center mb-4">
      <p class="style-title fadein-text">Bienvenue chez Nugery,</p>
      <p class="style-title fadein-text">bienvenue chez vous</p>
    </div>

    <h4 class="mt-4 left-title fadein-1">Votre demande a bien été prise en compte.
      <i class="bi bi-check-square ms-2 text-success icon-fadein-1"></i>
    </h4>

    <h4 class="mt-4 left-title fadein-2">Vous allez recevoir un email de confirmation.
      <i class="bi bi-check-square ms-2 text-success icon-fadein-2"></i>
    </h4>

    <h4 class="mt-4 left-title fadein-3">Nous vous contacterons prochainement.
      <i class="bi bi-check-square ms-2 text-success icon-fadein-3"></i>
    </h4>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
</body>
</html>
