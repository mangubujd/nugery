<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nugery Site Officiel</title>

  <!-- Liens externes -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
  <!-- Font Cal Sans Google  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cal+Sans&display=swap" rel="stylesheet">
  
  
  <style>


    /* === Styles responsive ajoutés === */
    body {
      margin: 0;
      padding: 0;
      background-color: #fff;
    }

    /* ===== Header ===== */
    .header {
      flex-wrap: wrap;
      justify-content: center;
      text-align: center;
    }

    .header .logo {
      max-width: 150px;
      height: auto;
    }


    /* ===== Text section ===== */
    .text-section {
      text-align: center;
      padding: 1.5rem;
    }

    .text-section .text-1 {
      font-size: 1.8rem;
      font-weight: bold;
    }

    .text-section .text-2 {
      font-size: 1.1rem;
      color: #666;
    }

    /* ===== Responsive text scaling ===== */
    @media (max-width: 768px) {
      .blockcontainer {
      text-align: center;
      width: 100%;
      padding: 0px 20px;
      margin-top: 100px;
      } 
    }

    @media (max-width: 480px) {
      .blockcontainer {
      text-align: center;
      width: 100%;
      padding: 0px 20px;
      margin-top: 100px;
      } 
    }
  </style>
</head>

<body>
  <header class="header container my-4 d-flex align-items-center gap-3">
    <div class="logo-wrapper">
      <img src="logo_white-1.png" alt="Logo Nugery" class="logo" width="200" height="108">
    </div>
  </header>
  <main>
    <div class="blockcontainer">
      <span class="welcome">Bienvenue sur notre plateforme de prise de rendez-vous.</span><br/><br/>
      <a href="formulaire-contact.html" class="btn btn-light btn-lg custom-btn-2">Je prends RDV</a>
    </div>
  </main>
  <picture class="bg-img1">
	  <source media="(max-width: 100vh)" srcset="background.jpeg">
		<img class="skip-lazy" src="background.jpeg">
	</picture>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
